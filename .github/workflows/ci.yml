name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 06:00 UTC to detect newly disclosed CVEs without code changes
    - cron: "0 6 * * *"

jobs:
  check:
    name: Format and lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Format check
        run: mise x -- lefthook run format-check

      - name: Lint check
        env:
          RUMDL_OUTPUT_FORMAT: github
        run: mise x -- lefthook run lint-check

  test:
    name: Harness tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for harness test runner
        id: check-tests
        run: |
          if [ -f tests/run.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mise
        if: steps.check-tests.outputs.run == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Run harness tests
        if: steps.check-tests.outputs.run == 'true'
        run: mise run test

  scan:
    name: SBOM and security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Generate CycloneDX SBOM
        run: mise run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: sbom.cdx.json
          archive: false

      - name: Vulnerability and license scan
        run: mise run scan
