# Project-specific tools and tasks for WJ44/trivy-plugin-mise.
# Baseline harness tools and tasks live in `.config/mise/conf.d/harness.toml`.

[tools]
rust = { version = "1.100.0", components = ["rustfmt", "clippy"] }

[tasks.test]
description = "Run Rust unit and integration tests"
run = "cargo test --locked"
