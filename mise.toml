# Pinned dev tools: `mise install` installs them, mise.lock pins checksums.
# See agent-context/harness/formatting-and-linting.md.

[tools]
node = "26.13.1"
"npm:prettier" = "3.9.10"
shfmt = "3.14.1"
lefthook = "2.2.2"
tombi = "1.11.2"
shellcheck = "0.11.0"
ruff = "0.17.4"
"npm:@commitlint/cli" = "21.2.4"
trivy = "0.76.2"
rust = { version = "1.100.0", components = ["rustfmt", "clippy"] }

[tasks.sbom]
description = "Generate CycloneDX JSON Software Bill of Materials (SBOM)"
run = "bin/mise-sbom"

[tasks.scan]
description = "Scan repository and toolchain for vulnerabilities and licenses"
run = "bin/mise-sbom scan"
