# Pinned dev tools: `mise install` installs them, mise.lock pins checksums.
# See agent-context/harness/formatting-and-linting.md.

[tools]
node = "26.13.1"
"npm:prettier" = "3.10.1"
shfmt = "3.14.1"
lefthook = "2.2.2"
tombi = "1.11.3"
shellcheck = "0.11.0"
ruff = "0.17.6"
"npm:@commitlint/cli" = "21.2.4"
trivy = "0.76.2"
uv = "0.13.9"
ripgrep = "16.0.0"
yq = "4.54.3"
"github:newren/git-filter-repo" = "2.47.0"
"aqua:rvben/rumdl" = "0.3.5"

[tasks.sbom]
description = "Generate CycloneDX JSON Software Bill of Materials (SBOM)"
run = "bin/mise-sbom"

[tasks.scan]
description = "Scan repository and toolchain for vulnerabilities and licenses"
run = "bin/mise-sbom scan"

[tasks.test]
description = "Run automated harness script tests when present"
run = 'sh -c "if [ -f tests/run.py ]; then exec uv run --script tests/run.py \"\$@\"; elif [ -d tests ]; then echo \"No harness test runner found; configure [tasks.test] for your project.\" >&2; exit 1; else echo \"No tests/ directory found; skipping.\"; fi" _'
