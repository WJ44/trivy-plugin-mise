name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Cargo.toml and plugin.yaml versions match tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"

          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "${cargo_version}" != "${expected}" ]]; then
            echo "Error: Cargo.toml version (${cargo_version}) does not match tag ${TAG} (${expected})"
            exit 1
          fi

          plugin_version=$(grep -m1 '^version: ' plugin.yaml | sed -E 's/version: "([^"]+)".*/\1/')
          if [[ "${plugin_version}" != "${expected}" ]]; then
            echo "Error: plugin.yaml version (${plugin_version}) does not match tag ${TAG} (${expected})"
            exit 1
          fi

          uri_lines=$(grep -E '^[[:space:]]*uri:' plugin.yaml || true)
          if [[ -z "${uri_lines}" ]]; then
            echo "Error: no uri entries found in plugin.yaml"
            exit 1
          fi
          if echo "${uri_lines}" | grep -qv "releases/download/${TAG}/trivy-plugin-mise-${TAG}-"; then
            echo "Error: one or more plugin.yaml platform URIs do not reference ${TAG}:"
            echo "${uri_lines}" | grep -v "releases/download/${TAG}/trivy-plugin-mise-${TAG}-"
            exit 1
          fi

  build:
    name: Build (${{ matrix.archive_suffix }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_suffix: linux-x64
            bin: trivy-plugin-mise
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_suffix: linux-arm64
            bin: trivy-plugin-mise
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_suffix: macos-x64
            bin: trivy-plugin-mise
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
            bin: trivy-plugin-mise
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x64
            bin: trivy-plugin-mise.exe
            ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Install Linux cross-compilation toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            sudo apt-get install -y musl-tools
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Add Rust target
        run: mise x -- rustup target add ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS:
            ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || ''
            }}
        run:
          mise x -- cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/trivy-plugin-mise-${{ github.ref_name }}-${{ matrix.archive_suffix }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" `
            -DestinationPath "dist/trivy-plugin-mise-${{ github.ref_name }}-${{ matrix.archive_suffix }}.zip"

      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.archive_suffix }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"

      - name: Upload or create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp plugin.yaml dist/plugin.yaml
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
