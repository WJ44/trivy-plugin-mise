# Formatting and linting. See agent-context/harness/formatting-and-linting.md.
#
#   lefthook run format          fix formatting on all files
#   lefthook run format-check    check formatting on all files, write nothing
#   lefthook run lint            fix lint issues on all files (where supported)
#   lefthook run lint-check      check lint issues on all files, write nothing
#
# Add --file <path> (repeatable) to any command to limit it to specific files.
#
# Every tool gets every file and picks out the ones it handles: Prettier skips unknown
# files (--ignore-unknown), shfmt --find keeps shell files (by extension or shebang).
# Tools that can't pick out their own files get a glob (tombi, trivyignore).
#
# Commands with pipes start with set -o pipefail, so failures aren't hidden.

# Git hooks source this first, so layered mise tools (.config/mise/conf.d/harness.toml / mise.toml) are on PATH.
rc: ./.lefthookrc

# Downstream projects place custom formatters, linters, or named job overrides
# in lefthook.project.yml (loaded automatically when present) rather than editing
# lefthook.yml directly.
extends:
  - lefthook.project.yml

pre-commit:
  piped: true
  jobs:
    # Fail before formatting so unresolved conflict markers are never reformatted
    # and re-staged via stage_fixed.
    - name: conflict-markers
      run: |
        set -o pipefail
        printf '%s\0' {staged_files} |
          lefthook run lint-check --no-auto-install --job conflict-markers --files-from-stdin
    # Runs the format jobs on the staged files, so each tool is only listed below.
    # printf: the file list goes over stdin, one NUL-terminated path per file.
    - name: format
      run: |
        printf '%s\0' {staged_files} |
          lefthook run format --no-auto-install --files-from-stdin
      stage_fixed: true
    - name: lint
      run: |
        printf '%s\0' {staged_files} |
          lefthook run lint-check --no-auto-install --files-from-stdin

commit-msg:
  jobs:
    - name: commitlint
      run: commitlint --edit {1}

post-checkout:
  jobs:
    - name: hydrate-worktree
      run: |
        set -eu
        if [ "{3}" = "0" ]; then
          exit 0
        fi
        grep -qxF "# --- harness:release:start ---" .gitignore 2>/dev/null || exit 0
        git_dir=$(git rev-parse --git-dir 2>/dev/null) || exit 0
        common_dir=$(git rev-parse --git-common-dir 2>/dev/null) || exit 0
        if [ "$(cd "$git_dir" && pwd -P)" = "$(cd "$common_dir" && pwd -P)" ]; then
          exit 0
        fi
        cur_root=$(pwd -P)
        git worktree list --porcelain | while IFS= read -r line; do
          case "$line" in
          "worktree "*)
            wt="${line#worktree }"
            wt_real=$(cd "$wt" 2>/dev/null && pwd -P) || continue
            if [ "$wt_real" != "$cur_root" ] && [ -f "$wt_real/bin/harness.py" ]; then
              if python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' 2>/dev/null; then
                python3 "$wt_real/bin/harness.py" hydrate-worktree --source-worktree "$wt_real" --root "$cur_root" --quiet
              else
                "$wt_real/bin/harness.py" hydrate-worktree --source-worktree "$wt_real" --root "$cur_root" --quiet
              fi
              break
            fi
            ;;
          esac
        done

format:
  # Each file has one formatter, so the jobs never touch the same file.
  files: &repo_files |
    git -c core.quotepath=false ls-files --cached --others --exclude-standard |
      while IFS= read -r f; do
        if [ -e "$f" ] || [ -L "$f" ]; then
          printf '%s\n' "$f"
        fi
      done
  parallel: true
  jobs:
    - name: prettier
      run: prettier --write --ignore-unknown {files}
    - name: shfmt
      run: |
        set -o pipefail
        shfmt --find=0 {files} | xargs -0 -r shfmt --write
    - name: tombi
      glob: "*.toml"
      run: tombi format --quiet {files}

format-check:
  files: *repo_files
  parallel: true
  jobs:
    - name: prettier
      run: prettier --check --ignore-unknown {files}
    - name: shfmt
      run: |
        set -o pipefail
        shfmt --find=0 {files} | xargs -0 -r shfmt --diff
    - name: tombi
      glob: "*.toml"
      # --check alone doesn't show what's wrong; --diff alone writes the fix.
      run: tombi format --check --diff {files}

lint:
  files: *repo_files
  parallel: true
  jobs:
    - &conflict_markers_job
      name: conflict-markers
      run: |
        rc=0
        grep -nIE -- '^(<{7}|={7}|>{7})([[:space:]]|$)' {files} </dev/null || rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "Error: unresolved merge conflict markers found." >&2
          exit 1
        elif [ "$rc" -ne 1 ]; then
          exit "$rc"
        fi
    - name: shellcheck
      run: |
        set -o pipefail
        shfmt --find=0 {files} | xargs -0 -r shellcheck
    - group:
        parallel: false
        pipelined: false
        jobs:
          - name: rumdl
            glob: "*.md"
            run: rumdl check --fix {files}
          - &decisions_job
            name: decisions
            glob: "{decisions/*.md,decisions/harness/*.md,./decisions/*.md,./decisions/harness/*.md}"
            run: bin/validate-decisions.py {files}
    - &trivyignore_job
      name: trivyignore
      glob: "{.trivyignore.yaml,./.trivyignore.yaml}"
      run:
        yq --yaml-fix-merge-anchor-to-spec=true --from-file
        bin/validate-trivyignore.yq {files} >/dev/null
    - &tombi_lint_job
      name: tombi
      glob: "*.toml"
      run: tombi lint --quiet {files}

lint-check:
  files: *repo_files
  parallel: true
  jobs:
    - *conflict_markers_job
    - name: shellcheck
      run: |
        set -o pipefail
        shfmt --find=0 {files} | xargs -0 -r shellcheck
    - name: rumdl
      glob: "*.md"
      run: rumdl check {files}
    - *decisions_job
    - *trivyignore_job
    - *tombi_lint_job
    # Intentionally check-only (omitted from `lint`) so hooks/post-edit does not
    # fail mid-edit on mise config before `mise lock` is run.
    - name: mise-lock
      glob: "{mise.toml,.mise.toml,mise.lock,.config/mise/conf.d/*.toml,.config/mise/mise.lock,./mise.toml,./.mise.toml,./mise.lock,./.config/mise/conf.d/*.toml,./.config/mise/mise.lock}"
      run: mise lock --check
