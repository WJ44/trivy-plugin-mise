name: "mise"
repository: github.com/WJ44/trivy-plugin-mise
maintainer: WJ44
version: "0.1.0"
summary:
  Trivy plugin for mise CycloneDX SBOM generation and vulnerability scanning
usage: mise [command]
output: false
description: |-
  Trivy plugin and standalone CLI that bridges jdx/mise (mise.toml, mise.lock,
  .mise/locks/) with aquasecurity/trivy for CycloneDX SBOM generation and
  vulnerability scanning.
platforms:
  - selector:
      os: linux
      arch: amd64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v0.1.0/trivy-plugin-mise-v0.1.0-linux-x64.tar.gz
    bin: ./trivy-plugin-mise
  - selector:
      os: linux
      arch: arm64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v0.1.0/trivy-plugin-mise-v0.1.0-linux-arm64.tar.gz
    bin: ./trivy-plugin-mise
  - selector:
      os: darwin
      arch: amd64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v0.1.0/trivy-plugin-mise-v0.1.0-macos-x64.tar.gz
    bin: ./trivy-plugin-mise
  - selector:
      os: darwin
      arch: arm64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v0.1.0/trivy-plugin-mise-v0.1.0-macos-arm64.tar.gz
    bin: ./trivy-plugin-mise
  - selector:
      os: windows
      arch: amd64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v0.1.0/trivy-plugin-mise-v0.1.0-windows-x64.zip
    bin: ./trivy-plugin-mise.exe
