name: "mise"
repository: github.com/WJ44/trivy-plugin-mise
maintainer: WJ44
version: "1.1.0" # x-release-please-version
summary:
  Trivy plugin for mise CycloneDX SBOM generation and vulnerability scanning
usage: mise [command]
output: false
description: |-
  Trivy plugin and standalone CLI that bridges jdx/mise (mise.toml, mise.lock,
  .mise/locks/) with aquasecurity/trivy for CycloneDX SBOM generation and
  vulnerability scanning.
platforms:
  - selector:
      os: linux
      arch: amd64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v1.1.0/trivy-plugin-mise-linux-x64.tar.gz # x-release-please-version
    bin: ./trivy-plugin-mise
  - selector:
      os: linux
      arch: arm64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v1.1.0/trivy-plugin-mise-linux-arm64.tar.gz # x-release-please-version
    bin: ./trivy-plugin-mise
  - selector:
      os: darwin
      arch: amd64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v1.1.0/trivy-plugin-mise-macos-x64.tar.gz # x-release-please-version
    bin: ./trivy-plugin-mise
  - selector:
      os: darwin
      arch: arm64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v1.1.0/trivy-plugin-mise-macos-arm64.tar.gz # x-release-please-version
    bin: ./trivy-plugin-mise
  - selector:
      os: windows
      arch: amd64
    uri: https://github.com/WJ44/trivy-plugin-mise/releases/download/v1.1.0/trivy-plugin-mise-windows-x64.zip # x-release-please-version
    bin: ./trivy-plugin-mise.exe
