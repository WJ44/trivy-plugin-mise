[package]
name = "trivy-plugin-mise"
version = "1.0.0"
edition = "2024"
description = "Trivy plugin and standalone CLI bridging mise with Trivy for CycloneDX SBOM generation and vulnerability scanning"
repository = "https://github.com/WJ44/trivy-plugin-mise"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0.21"
toml = "1.2.1"
