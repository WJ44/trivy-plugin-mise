# Markdown linting configuration for rumdl.
# See agent-context/harness/formatting-and-linting.md and
# decisions/harness/031-rumdl-and-decision-validation.md.

[global]
# Keep defaults (including flavor = "standard", which "gfm"/"github" alias to)
# and opt in to structural/safety rules that complement Prettier without
# fighting existing prose or frontmatter conventions.
extend-enable = ["MD070", "MD080", "MD083", "MD087", "MD091", "MD095"]
# Generated by release-please / changelog tools (long URLs, blank lines, repeated headings).
exclude = ["CHANGELOG.md"]

[MD013]
# Prettier wraps prose at 80 columns but leaves fenced code blocks unwrapped.
code-blocks = false

[per-file-ignores]
# Template and fragment files intentionally omit a leading level-1 heading.
".github/PULL_REQUEST_TEMPLATE/*.md" = ["MD041"]
"AGENTS.template.md" = ["MD041"]
"CLAUDE.md" = ["MD041"]
"README.template.md" = ["MD041"]
# Fragment files omit leading H1 and author root-relative links for rendered AGENTS.md/README.md.
"agent-context/*.project.md" = ["MD041", "MD057"]
"templates/*.project.md" = ["MD041"]
# Template copied to decisions/README.md on init; harness/README.md resolves there.
"templates/decisions-README.md" = ["MD057"]
