name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check release-please prerequisites
        id: check
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          missing=""
          if [ ! -f release-please-config.json ] || [ ! -f .release-please-manifest.json ]; then
            missing="release-please-config.json and/or .release-please-manifest.json"
          fi
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            if [ -n "$missing" ]; then
              missing="$missing, and RELEASE_PLEASE_TOKEN secret"
            else
              missing="RELEASE_PLEASE_TOKEN secret"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::notice::Skipping release-please: missing $missing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-please
        if: steps.check.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
