# Pinned harness baseline dev tools and tasks: `mise install` installs them,
# `.config/mise/mise.lock` pins checksums.
# Downstream projects add language tools and task overrides in root `mise.toml`
# (via `mise use` / `mise set`) rather than editing this file directly.
# See agent-context/harness/formatting-and-linting.md.

[tools]
node = "26.13.1"
"npm:prettier" = "3.10.1"
shfmt = "3.14.1"
lefthook = "2.2.2"
tombi = "1.11.3"
shellcheck = "0.11.0"
"npm:@commitlint/cli" = "21.2.4"
trivy = "0.76.2"
uv = "0.13.9"
ripgrep = "16.0.0"
yq = "4.54.3"
"github:newren/git-filter-repo" = "2.47.0"
"aqua:rvben/rumdl" = "0.3.5"
"github:WJ44/trivy-plugin-mise" = "1.1.0"

[tasks.sbom]
description = "Generate CycloneDX JSON Software Bill of Materials (SBOM)"
run = "trivy-plugin-mise sbom --output sbom.cdx.json"

[tasks.scan]
description = "Scan repository and toolchain for vulnerabilities and licenses"
run = "trivy-plugin-mise scan"
lock = "trivy-scan"
